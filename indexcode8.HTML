<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hobby Container</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <div class="container">
        <div class="hobby">
            <img src="reading.jpg" alt="Reading">

        <div class="hobby">
            <img src="gaming.jpg" alt="Gaming">
            <p>Gaming</p>
        </div>
        <div class="hobby">
            <img src="cooking.jpg" alt="Cooking">
            <p>Cooking</p>
        </div>
        <div class="hobby">
            <img src="photography.jpg" alt="Photography">
            <p>Photography</p>
        </div>

        </div>
        <div class="hobby">
            <img src="painting.jpg" alt="Painting">
            <p>Painting</p>
        </div>
        <div class="hobby">
            <img src="gardening.jpg" alt="Gardening">
            <p>Gardening</p>
        </div>
        <div class="hobby">
            <img src="music.jpg" alt="Music">
            <p>Music</p>
        </div>
        <div class="hobby">

</html>
